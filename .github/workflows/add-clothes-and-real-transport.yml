name: Add colored clothes and real transport sounds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-clothes-and-real-transport.yml'

permissions:
  contents: write
  id-token: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AI_DEFAULT_PROVIDER: google-cloud
      GOOGLE_CLOUD_PROJECT: project-a095a9ee-fc31-43e4-9f8
      GOOGLE_IMAGE_LOCATION: global
      GOOGLE_VISION_LOCATION: global
      GOOGLE_IMAGE_MODEL: gemini-3.1-flash-image
      GOOGLE_VISION_MODEL: gemini-3.5-flash
      GOOGLE_TTS_MODEL: gemini-2.5-flash-tts
      GOOGLE_TTS_VOICE_DE: Leda
      GOOGLE_TTS_VOICE_UA: Sulafat
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: project-a095a9ee-fc31-43e4-9f8
          workload_identity_provider: projects/375735107269/locations/global/workloadIdentityPools/github/providers/github
          service_account: sashka-generator@project-a095a9ee-fc31-43e4-9f8.iam.gserviceaccount.com
          token_format: access_token
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate colored clothing cards with Google Cloud only
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          IDS='white-shirt black-pants red-dress blue-shoe green-hat yellow-jacket orange-sweater purple-skirt brown-boots'
          for id in $IDS; do
            node scripts/generate-one-image.mjs --provider=google-cloud --id="$id" --force=true --qa=true
            sleep 5
            node scripts/generate-one-audio.mjs --provider=google-cloud --id="$id" --mode=de --kinds=question,success,wrong,retry --force=true --pause-ms=700
            sleep 3
            node scripts/generate-one-audio.mjs --provider=google-cloud --id="$id" --mode=ua --kinds=question,success,wrong,retry --force=true --pause-ms=700
            sleep 8
          done
      - name: Verify clothes files before publish
        run: |
          set -euo pipefail
          IDS='white-shirt black-pants red-dress blue-shoe green-hat yellow-jacket orange-sweater purple-skirt brown-boots'
          for id in $IDS; do
            test -s "public/assets/generated/images/$id.png"
            for lang in de ua; do
              for kind in question success wrong retry; do
                test -s "public/assets/generated/audio/$id.$kind.$lang.wav"
              done
            done
          done
      - name: Publish clothes first
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/categories/clothes.json
          git add -f public/assets/generated/images/*.png
          git add -f public/assets/generated/audio/*.wav
          git commit -m 'feat: publish colored clothes cards with images' || true
          git restore logs/generation.jsonl public/assets/generated/progress.json 2>/dev/null || true
          git clean -f gha-creds-*.json 2>/dev/null || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Download verified real transport recordings and longer applause
        run: |
          set -euo pipefail
          mkdir -p public/assets/sfx/transport public/assets/sfx
          fetch(){
            name="$1"; file="$2"; start="$3"; dur="$4"
            encoded="${file// /%20}"
            curl -L --fail --retry 4 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/$encoded" -o /tmp/src
            ffmpeg -y -hide_banner -loglevel error -ss "$start" -t "$dur" -i /tmp/src -af 'afade=t=in:st=0:d=0.03,afade=t=out:st=1.75:d=0.30,volume=0.78' -ar 44100 -ac 2 -c:a libvorbis -q:a 5 "public/assets/sfx/transport/$name.ogg"
            test -s "public/assets/sfx/transport/$name.ogg"
          }
          fetch car '5 cylinder engine sound.ogg' 2 2.1
          fetch bus 'WWS CityBusMANSG220engine.ogg' 5 2.1
          fetch train 'WWS Signalhorntrainhorn.ogg' 0 2.1
          fetch bicycle 'Ding Dong Bicycle Bell A.ogg' 0 2.1
          fetch airplane 'Jet airliner overhead.ogg' 8 2.1
          fetch ship 'Cruise ship Albatros ship horn.ogg' 1 2.1
          fetch truck 'Deutz 260 F8L413F.Ogg' 0 2.1
          fetch tractor 'WWS TractorUrsusC342engine.ogg' 4 2.1
          fetch tram 'Sydney tram 18 - 2016-02-14-2.ogg' 0 2.1
          fetch helicopter 'Helicopter over quiet n.ogg' 8 2.1
          curl -L --fail --retry 4 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/5/5b/Applause_i.ogg' -o /tmp/applause-source.ogg
          ffmpeg -y -hide_banner -loglevel error -ss 0.15 -t 3.20 -i /tmp/applause-source.ogg -af 'afade=t=in:st=0:d=0.04,afade=t=out:st=2.75:d=0.45,volume=0.62' -ar 44100 -ac 2 -c:a libvorbis -q:a 5 public/assets/sfx/applause.ogg
          test -s public/assets/sfx/applause.ogg
          test "$(find public/assets/sfx/transport -maxdepth 1 -name '*.ogg' -type f -size +100c | wc -l)" -eq 10
      - name: Publish natural sounds
        run: |
          set -euo pipefail
          git add -f public/assets/sfx/applause.ogg public/assets/sfx/transport/*.ogg
          git commit -m 'feat: publish real transport sounds and longer applause' || true
          git clean -f gha-creds-*.json 2>/dev/null || true
          git pull --rebase origin main
          git push origin HEAD:main
