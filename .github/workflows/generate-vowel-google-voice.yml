name: Generate recorded Google vowel voices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-vowel-google-voice.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: generate-vowel-google-voice
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: project-a095a9ee-fc31-43e4-9f8
      GOOGLE_TTS_MODEL: gemini-2.5-flash-tts
      GOOGLE_TTS_VOICE: Leda
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: auth
        name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: project-a095a9ee-fc31-43e4-9f8
          workload_identity_provider: projects/375735107269/locations/global/workloadIdentityPools/github/providers/github
          service_account: sashka-generator@project-a095a9ee-fc31-43e4-9f8.iam.gserviceaccount.com
          token_format: access_token

      - name: Generate warm German vowel recordings
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { generateSpeech } from './src/server/providers/google-cloud.mjs';
          const out='public/assets/generated/audio';
          await fs.mkdir(out,{recursive:true});
          const rows=[
            ['a','A','Apfel'],['e','E','Elefant'],['i','I','Igel'],['o','O','Orange'],['u','U','Uhu']
          ];
          const style='warm, friendly, clear native German kindergarten teacher; calm and encouraging; natural smile in the voice; very clear vowel pronunciation; slightly elongated target vowel at the start; premium educational audio; no singing, no exaggerated cartoon voice, no background sound';
          for(const [id,letter,word] of rows){
            const clips={
              question:`${letter}. Finde ${letter}.`,
              success:`${letter}. ${letter} wie ${word}.`,
              retry:`Noch einmal. Finde ${letter}.`
            };
            for(const [kind,text] of Object.entries(clips)){
              const r=await generateSpeech({text,language:'de-DE',style});
              const p=`${out}/letter-${id}.${kind}.de.wav`;
              await fs.writeFile(p,r.buffer);
              console.log(p,r.buffer.length);
            }
          }
          NODE

      - name: Validate recordings
        run: |
          python3 - <<'PY'
          import wave
          from pathlib import Path
          for l in 'aeiou':
            for k in ('question','success','retry'):
              p=Path(f'public/assets/generated/audio/letter-{l}.{k}.de.wav')
              if not p.exists() or p.stat().st_size < 1000: raise SystemExit(f'missing {p}')
              with wave.open(str(p),'rb') as w:
                d=w.getnframes()/w.getframerate()
              print(p.name,round(d,2),'s')
              if not (0.35 <= d <= 8): raise SystemExit(f'bad duration {p}: {d}')
          PY

      - name: Switch vowel module to recorded audio only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='public/letters-module.js';
          let s=fs.readFileSync(p,'utf8');
          const a=s.indexOf("  function stopSpeech(){");
          const b=s.indexOf("\n\n  function installEntry()",a);
          if(a<0||b<0) throw new Error('speech block not found');
          const block=`  let activeAudio = null;\n  function stopSpeech(){\n    if(activeAudio){ activeAudio.pause(); activeAudio.currentTime=0; activeAudio=null; }\n  }\n  function audioPath(kind){\n    const id=current?.letter?.toLowerCase();\n    return id ? \`./assets/generated/audio/letter-\${id}.\${kind}.de.wav\` : '';\n  }\n  function playClip(kind){\n    stopSpeech();\n    const src=audioPath(kind);\n    if(!src) return Promise.resolve(false);\n    return new Promise(resolve=>{\n      const a=new Audio(src); activeAudio=a; a.preload='auto'; a.volume=1;\n      a.onended=()=>{ if(activeAudio===a) activeAudio=null; resolve(true); };\n      a.onerror=()=>{ if(activeAudio===a) activeAudio=null; resolve(false); };\n      a.play().catch(()=>resolve(false));\n    });\n  }`;
          s=s.slice(0,a)+block+s.slice(b);
          s=s.replace("main.querySelector('.letters-repeat').onclick = () => current && speak(`${current.letter}. Finde ${current.letter}.`);","main.querySelector('.letters-repeat').onclick = () => current && playClip('question');");
          s=s.replace("nextTimer=setTimeout(()=>speak(`${current.letter}. Finde ${current.letter}.`),220);","nextTimer=setTimeout(()=>playClip('question'),220);");
          s=s.replace("speak(`Noch einmal. Finde ${current.letter}.`);","playClip('retry');");
          s=s.replace("speak(`${current.letter}. ${current.letter} wie ${current.word}.`);","playClip('success');");
          if(s.includes('SpeechSynthesisUtterance')||s.includes('speechSynthesis.speak')) throw new Error('system TTS still present');
          fs.writeFileSync(p,s);
          NODE
          node --check public/letters-module.js
          grep -q "playClip('question')" public/letters-module.js
          grep -q "playClip('success')" public/letters-module.js
          grep -q "playClip('retry')" public/letters-module.js
          ! grep -q 'SpeechSynthesisUtterance' public/letters-module.js

      - name: Rotate PWA cache and remove temporary workflow
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text(); nums=[int(x) for x in re.findall(r'\?v=(\d+)',s)]; n=(max(nums) if nums else 46)+1; s=re.sub(r'\?v=\d+',f'?v={n}',s); p.write_text(s)
          p=Path('public/sw.js'); s=p.read_text(); s=re.sub(r'sashka-molodets-v\d+',f'sashka-molodets-v{n}',s); p.write_text(s)
          print('cache',n)
          PY
          rm -f .github/workflows/generate-vowel-google-voice.yml

      - name: Commit recorded vowel voices
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/assets/generated/audio/letter-*.de.wav
          git add public/letters-module.js public/index.html public/sw.js .github/workflows/generate-vowel-google-voice.yml
          git commit -m 'feat: use recorded Google voice for German vowels'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*2))
          done
          exit 2
