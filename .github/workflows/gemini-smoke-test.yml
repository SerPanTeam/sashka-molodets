name: Gemini smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-smoke-test.yml'

permissions:
  contents: write

concurrency:
  group: gemini-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_MODEL: gemini-3.1-flash-tts-preview
      GOOGLE_TTS_VOICE: Sulafat
      GOOGLE_IMAGE_MODEL: gemini-3.1-flash-image
    steps:
      - name: ① Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ② Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ③ Verify GEMINI_API_KEY
        run: |
          date -u '+[%Y-%m-%dT%H:%M:%SZ] checking GEMINI_API_KEY'
          test -n "$GEMINI_API_KEY" || (echo 'ERROR: GEMINI_API_KEY is missing' && exit 1)
          echo 'OK: GEMINI_API_KEY is present (value hidden)'

      - name: ④ Generate ONE German TTS
        run: |
          mkdir -p public/assets/generated/smoke logs
          date -u '+[%Y-%m-%dT%H:%M:%SZ] START TTS: Alexander, super! Gut gemacht! Das ist die Tomate.' | tee logs/gemini-smoke.log
          node --input-type=module <<'NODE'
          import { writeFile, stat } from 'node:fs/promises';
          import { generateSpeech } from './src/server/providers/google.mjs';
          const started = Date.now();
          try {
            const result = await generateSpeech({
              text: 'Alexander, super! Gut gemacht! Das ist die Tomate.',
              language: 'German de-DE only',
              style: 'warm, cheerful, caring preschool educator; clear native German pronunciation; pleasant and encouraging; medium-slow pace; speak only the transcript'
            });
            const file = 'public/assets/generated/smoke/tomato.success.de.wav';
            await writeFile(file, result.buffer);
            const s = await stat(file);
            console.log(`[TTS SUCCESS] file=${file} bytes=${s.size} ms=${Date.now()-started}`);
          } catch (error) {
            console.error('[TTS ERROR]', error?.stack || error);
            process.exit(1);
          }
          NODE
          date -u '+[%Y-%m-%dT%H:%M:%SZ] SUCCESS TTS' | tee -a logs/gemini-smoke.log
          ls -lh public/assets/generated/smoke/tomato.success.de.wav

      - name: ⑤ Generate ONE tomato image
        run: |
          date -u '+[%Y-%m-%dT%H:%M:%SZ] START IMAGE: tomato' | tee -a logs/gemini-smoke.log
          node --input-type=module <<'NODE'
          import { writeFile, stat } from 'node:fs/promises';
          import { generateImage } from './src/server/providers/google.mjs';
          const started = Date.now();
          const prompt = 'Create a premium educational picture card for a child aged 3–7. SUBJECT: one ripe red tomato with green calyx. Exactly one tomato, centered, large, complete object visible, square 1:1, very light warm cream background. Polished friendly high-quality 3D children educational illustration, believable real tomato shape and natural bright colors, soft studio light, subtle contact shadow. No face, eyes, mouth, arms, legs, text, letters, labels, border, logo, watermark, people, hands, props, duplicate objects or confusing extras.';
          try {
            const result = await generateImage({ prompt, aspectRatio: '1:1', imageSize: '1K' });
            const file = 'public/assets/generated/smoke/tomato.jpg';
            await writeFile(file, result.buffer);
            const s = await stat(file);
            console.log(`[IMAGE SUCCESS] file=${file} bytes=${s.size} mime=${result.mimeType} ms=${Date.now()-started}`);
          } catch (error) {
            console.error('[IMAGE ERROR]', error?.stack || error);
            process.exit(1);
          }
          NODE
          date -u '+[%Y-%m-%dT%H:%M:%SZ] SUCCESS IMAGE' | tee -a logs/gemini-smoke.log
          ls -lh public/assets/generated/smoke/tomato.jpg

      - name: ⑥ Persist proof to main
        run: |
          date -u '+[%Y-%m-%dT%H:%M:%SZ] COMMIT smoke assets' | tee -a logs/gemini-smoke.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/generated/smoke logs/gemini-smoke.log
          git commit -m 'test: persist successful Gemini smoke assets'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'SMOKE COMPLETE: TTS + image generated and persisted.'
