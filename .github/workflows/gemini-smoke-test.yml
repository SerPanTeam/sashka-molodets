name: Gemini image model probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-smoke-test.yml'

permissions:
  contents: write

concurrency:
  group: gemini-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: ① Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ② Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ③ Verify GEMINI_API_KEY
        run: |
          date -u '+[%Y-%m-%dT%H:%M:%SZ] checking GEMINI_API_KEY'
          test -n "$GEMINI_API_KEY" || (echo 'ERROR: GEMINI_API_KEY is missing' && exit 1)
          echo 'OK: GEMINI_API_KEY is present (value hidden)'

      - name: ④ Probe 4 Gemini image models
        run: |
          set -o pipefail
          mkdir -p public/assets/generated/probes logs
          : > logs/image-model-probe.log
          node --input-type=module 2>&1 <<'NODE' | tee -a logs/image-model-probe.log
          import { writeFile, stat } from 'node:fs/promises';
          import { generateImage } from './src/server/providers/google.mjs';

          const models = [
            'gemini-3.1-flash-lite-image',
            'gemini-3.1-flash-image',
            'gemini-3-pro-image',
            'gemini-2.5-flash-image',
          ];
          const prompt = 'Create a premium educational picture card for a child aged 3–7. SUBJECT: one ripe red tomato with green calyx. Exactly one tomato, centered, large, complete object visible, square 1:1, very light warm cream background. Polished friendly high-quality 3D children educational illustration, believable real tomato shape and natural bright colors, soft studio light, subtle contact shadow. No face, eyes, mouth, arms, legs, text, labels, border, logo, watermark, people, hands, props, duplicate objects or confusing extras.';

          for (const model of models) {
            const started = Date.now();
            console.log(`\n[PROBE START] model=${model} at=${new Date().toISOString()}`);
            try {
              const result = await generateImage({ prompt, aspectRatio: '1:1', imageSize: '1K', model });
              const file = `public/assets/generated/probes/${model}.jpg`;
              await writeFile(file, result.buffer);
              const s = await stat(file);
              console.log(`[PROBE SUCCESS] model=${model} file=${file} bytes=${s.size} mime=${result.mimeType} ms=${Date.now()-started}`);
            } catch (error) {
              const text = String(error?.message || error).replace(/\s+/g, ' ').slice(0, 1800);
              console.log(`[PROBE ERROR] model=${model} ms=${Date.now()-started} error=${text}`);
            }
            await new Promise(r => setTimeout(r, 2500));
          }
          NODE

      - name: ⑤ Persist probe results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f logs/image-model-probe.log
          git add public/assets/generated/probes/*.jpg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No probe results to persist.'
            exit 0
          fi
          git commit -m 'test: persist Gemini image model probe results'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'IMAGE MODEL PROBE RESULTS SAVED TO MAIN'
