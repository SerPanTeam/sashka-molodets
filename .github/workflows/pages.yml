name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production bundle
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/pages-shim.js
          node --check public/audio-bridge.js
          node --check public/object-sfx.js
          node scripts/validate-production.mjs
          CLOTHES='white-shirt black-pants red-dress blue-shoe green-hat yellow-jacket orange-sweater purple-skirt brown-boots'
          for id in $CLOTHES; do
            test -s "public/assets/generated/images/$id.png"
            for lang in de ua; do
              for kind in question success wrong retry; do
                test -s "public/assets/generated/audio/$id.$kind.$lang.wav"
              done
            done
          done
          TRANSPORT='car bus train bicycle airplane ship truck tractor tram helicopter'
          for id in $TRANSPORT; do test -s "public/assets/sfx/transport/$id.ogg"; done
          test -s public/assets/sfx/applause.ogg

      - name: Prepare static site
        run: |
          mkdir -p _site/content
          cp -R public/. _site/
          cp -R content/. _site/content/
          touch _site/.nojekyll

      - name: Browser smoke test local build
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory _site >/tmp/sashka-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "http://127.0.0.1:4173/index.html?smoke=${GITHUB_SHA}" > /tmp/sashka-local-dom.html
          grep -q 'Сашко, граємо?' /tmp/sashka-local-dom.html
          grep -q 'class="big-play"' /tmp/sashka-local-dom.html
          grep -q '>Tiere<' /tmp/sashka-local-dom.html
          grep -q '>Kleidung<' /tmp/sashka-local-dom.html
          grep -q 'Одяг · 9' /tmp/sashka-local-dom.html
          CLOTHES='white-shirt black-pants red-dress blue-shoe green-hat yellow-jacket orange-sweater purple-skirt brown-boots'
          for id in $CLOTHES; do
            curl -fsS -o /dev/null "http://127.0.0.1:4173/assets/generated/images/$id.png"
            for lang in de ua; do
              for kind in question success wrong retry; do
                curl -fsS -o /dev/null "http://127.0.0.1:4173/assets/generated/audio/$id.$kind.$lang.wav"
              done
            done
          done

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Browser and asset smoke test deployed Pages
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          URL="${{ steps.deployment.outputs.page_url }}"
          test -n "$URL"
          BASE="${URL%/}"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "${BASE}/?smoke=${GITHUB_SHA}" > /tmp/sashka-prod-dom.html
          grep -q 'Сашко, граємо?' /tmp/sashka-prod-dom.html
          grep -q 'class="big-play"' /tmp/sashka-prod-dom.html
          grep -q '>Tiere<' /tmp/sashka-prod-dom.html
          grep -q '>Kleidung<' /tmp/sashka-prod-dom.html
          grep -q 'Одяг · 9' /tmp/sashka-prod-dom.html
          CLOTHES='white-shirt black-pants red-dress blue-shoe green-hat yellow-jacket orange-sweater purple-skirt brown-boots'
          for id in $CLOTHES; do
            curl -fsS --retry 4 --retry-delay 2 -o /dev/null "${BASE}/assets/generated/images/$id.png?check=${GITHUB_SHA}"
            for lang in de ua; do
              for kind in question success wrong retry; do
                curl -fsS --retry 4 --retry-delay 2 -o /dev/null "${BASE}/assets/generated/audio/$id.$kind.$lang.wav?check=${GITHUB_SHA}"
              done
            done
          done
          TRANSPORT='car bus train bicycle airplane ship truck tractor tram helicopter'
          for id in $TRANSPORT; do
            curl -fsS --retry 4 --retry-delay 2 -o /dev/null "${BASE}/assets/sfx/transport/$id.ogg?check=${GITHUB_SHA}"
          done
          curl -fsS --retry 4 --retry-delay 2 -o /dev/null "${BASE}/assets/sfx/applause.ogg?check=${GITHUB_SHA}"
