name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production bundle
        run: |
          node --check public/app.js
          node --check public/pages-shim.js
          node --check public/audio-bridge.js
          node --check public/object-sfx.js
          node scripts/validate-production.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site/content
          cp -R public/. _site/
          cp -R content/. _site/content/
          touch _site/.nojekyll

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
