name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production bundle
        run: |
          node --check public/app.js
          node --check public/pages-shim.js
          node --check public/audio-bridge.js
          node --check public/object-sfx.js
          node scripts/validate-production.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site/content
          cp -R public/. _site/
          cp -R content/. _site/content/
          touch _site/.nojekyll

      - name: Browser smoke test local build
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/sashka-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "http://127.0.0.1:4173/index.html?smoke=${GITHUB_SHA}" > /tmp/sashka-local-dom.html
          grep -q 'Сашко, граємо?' /tmp/sashka-local-dom.html
          grep -q 'class="big-play"' /tmp/sashka-local-dom.html
          grep -q 'class="category-button"' /tmp/sashka-local-dom.html
          grep -q '>Tiere<' /tmp/sashka-local-dom.html

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Browser smoke test deployed Pages
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          URL="${{ steps.deployment.outputs.page_url }}"
          test -n "$URL"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "${URL}?smoke=${GITHUB_SHA}" > /tmp/sashka-prod-dom.html
          grep -q 'Сашко, граємо?' /tmp/sashka-prod-dom.html
          grep -q 'class="big-play"' /tmp/sashka-prod-dom.html
          grep -q 'class="category-button"' /tmp/sashka-prod-dom.html
          grep -q '>Tiere<' /tmp/sashka-prod-dom.html
