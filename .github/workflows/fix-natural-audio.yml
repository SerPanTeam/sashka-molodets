name: Fix natural Ukrainian voice and applause

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-natural-audio.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: fix-natural-audio
  cancel-in-progress: true

jobs:
  fix-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AI_DEFAULT_PROVIDER: google-cloud
      GOOGLE_CLOUD_PROJECT: project-a095a9ee-fc31-43e4-9f8
      GOOGLE_TTS_MODEL: gemini-2.5-flash-tts
      GOOGLE_TTS_VOICE_DE: Leda
      GOOGLE_TTS_VOICE_UA: Sulafat
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: project-a095a9ee-fc31-43e4-9f8
          workload_identity_provider: projects/375735107269/locations/global/workloadIdentityPools/github/providers/github
          service_account: sashka-generator@project-a095a9ee-fc31-43e4-9f8.iam.gserviceaccount.com
          token_format: access_token
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Add longer natural applause recording
        run: |
          set -euo pipefail
          mkdir -p public/assets/sfx
          curl -L --fail --retry 4 --retry-delay 3 'https://upload.wikimedia.org/wikipedia/commons/5/5b/Applause_i.ogg' -o /tmp/applause-source.ogg
          ffmpeg -y -hide_banner -loglevel error -ss 0.15 -t 3.20 -i /tmp/applause-source.ogg -af 'afade=t=in:st=0:d=0.04,afade=t=out:st=2.75:d=0.45,volume=0.62' -ar 44100 -ac 2 -c:a libvorbis -q:a 5 public/assets/sfx/applause.ogg
          test -s public/assets/sfx/applause.ogg
      - name: Publish applause
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/assets/sfx/applause.ogg
          git commit -m 'fix: longer natural applause' || true
          git clean -f gha-creds-*.json 2>/dev/null || true
          git pull --rebase origin main
          git push origin HEAD:main
