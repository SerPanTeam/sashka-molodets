name: Generate priority learning assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-priority-assets.yml'

permissions:
  contents: read

concurrency:
  group: generate-priority-assets
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Generation disabled
        run: echo 'AI generation disabled. No API calls will be made.'
