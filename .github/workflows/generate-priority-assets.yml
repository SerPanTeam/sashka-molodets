name: Generate priority learning assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-priority-assets.yml'

permissions:
  contents: write

concurrency:
  group: generate-priority-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_DEFAULT_PROVIDER: google
      GOOGLE_IMAGE_MODEL: gemini-3.1-flash-image
      GOOGLE_VISION_MODEL: gemini-3.6-flash
      GOOGLE_TTS_MODEL: gemini-3.1-flash-tts-preview
      GOOGLE_TTS_VOICE: Kore

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source
        run: |
          node --check public/app.js
          node --check scripts/generate-assets.mjs
          node --check src/server/providers/google.mjs
          node scripts/check-content.mjs
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'GEMINI_API_KEY secret is missing'
            exit 1
          fi

      - name: Generate Gemini bilingual voices
        run: |
          node scripts/generate-assets.mjs \
            --provider=google \
            --categories=animals,vegetables,fruits \
            --per-category=10 \
            --audio-only \
            --audio-kinds=question,success,retry \
            --pause-ms=850 \
            --continue-on-error

      - name: Commit generated voices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/generated/audio content/categories
          if git diff --cached --quiet; then
            echo 'No new voice assets to commit.'
          else
            git commit -m 'feat: generate Gemini bilingual learning voices'
            git push
          fi

      - name: Try generating reviewed learning images
        run: |
          node scripts/generate-assets.mjs \
            --provider=google \
            --categories=animals,vegetables,fruits \
            --per-category=10 \
            --image-attempts=3 \
            --pause-ms=900 \
            --continue-on-error

      - name: Commit generated images
        run: |
          git add public/assets/generated/images content/categories
          if git diff --cached --quiet; then
            echo 'No image assets were generated. Nano Banana API image generation requires a paid Gemini API tier.'
          else
            git commit -m 'feat: generate reviewed Gemini learning images'
            git push
          fi
