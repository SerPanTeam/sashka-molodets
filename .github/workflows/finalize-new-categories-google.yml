name: Finalize rooms nature actions Google assets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-new-categories-google.yml']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: project-a095a9ee-fc31-43e4-9f8
          workload_identity_provider: projects/375735107269/locations/global/workloadIdentityPools/github/providers/github
          service_account: sashka-generator@project-a095a9ee-fc31-43e4-9f8.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
      - name: Generate assets with Google Cloud only
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: project-a095a9ee-fc31-43e4-9f8
          GOOGLE_IMAGE_LOCATION: global
          GOOGLE_VISION_LOCATION: global
          GOOGLE_TTS_VOICE: Leda
          GOOGLE_TTS_UA_VOICE: Sulafat
        run: node scripts/generate-new-categories-google.mjs
      - name: Validate physical assets
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const c of ['rooms','nature','actions']){
            const d=JSON.parse(fs.readFileSync(`content/categories/${c}.json`));
            if(d.items.length!==6) throw Error(c+' count');
            for(const x of d.items){
              const files=[x.generatedImage,...Object.values(x.generatedAudioDe||{}),...Object.values(x.generatedAudioUa||{})];
              for(const f of new Set(files)){const p='public/'+f.replace(/^\.\//,''); if(!fs.existsSync(p)||fs.statSync(p).size<1000) throw Error('missing '+p)}
            }
          }
          NODE
      - name: Commit binaries and content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/categories/{rooms,nature,actions}.json
          git add -f public/assets/generated/images/*.png public/assets/generated/audio/*.wav
          git rm -f .github/workflows/finalize-new-categories-google.yml
          git commit -m 'feat: ship rooms nature actions production assets'
          git push
