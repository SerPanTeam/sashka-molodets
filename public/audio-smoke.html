<!doctype html><html><head><meta charset="utf-8"><title>audio smoke</title></head><body><div id="result">AUDIO_PENDING</div><script src="./audio-bridge.js"></script><script>(async()=>{const out=document.getElementById('result');try{const a=new Audio('./assets/generated/audio/apple.question.de.wav');a.volume=1;let advanced=false;a.addEventListener('timeupdate',()=>{if(a.currentTime>0.03)advanced=true},{once:false});await a.play();await new Promise((resolve,reject)=>{const t=setTimeout(()=>advanced?resolve():reject(new Error('no playback progress')),2500);a.addEventListener('ended',()=>{clearTimeout(t);advanced?resolve():reject(new Error('ended without progress'))},{once:true});setTimeout(()=>{if(advanced){clearTimeout(t);resolve()}},700)});a.pause();out.textContent='AUDIO_OK';document.title='AUDIO_OK'}catch(e){out.textContent='AUDIO_FAIL '+(e&&e.message||e);document.title='AUDIO_FAIL'}})();</script></body></html>
